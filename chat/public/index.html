<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; height: 100vh; }
    h1 { font-size: 1.25rem; margin: 0.5rem 0; }
    #chat { flex: 1; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { padding: 0.5rem 0.75rem; border-radius: 8px; white-space: pre-wrap; max-width: 85%; }
    .msg.user { align-self: flex-end; background: #e0f2fe; }
    .msg.assistant { align-self: flex-start; background: #f1f5f9; }
    .msg.error { align-self: center; background: #fee2e2; color: #991b1b; }
    form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    input { flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 0.6rem 1.2rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>
  <nav style="margin-bottom:0.5rem"><strong>Chat</strong> | <a href="/audio">Transcription &amp; traduction audio</a></nav>
  <h1>Chat Mistral</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Votre message…" autocomplete="off" />
    <button id="send" type="submit">Envoyer</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = [];

    function addMsg(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = "";
      addMsg("user", text);
      messages.push({ role: "user", content: text });
      send.disabled = true;

      addMsg("assistant", "…");
      const pending = chat.lastChild;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        pending.className = "msg assistant";
        pending.textContent = data.reply;
        messages.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
